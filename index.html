// SCORING ENGINE — weighted job-fit based on JobCriteria

function calcScore(emp,cat,criteria){
  if(!emp||!cat)return{score:0,color:"gray",details:{}};
  const crit=criteria.find(c=>c.category===cat);
  if(!crit)return{score:0,color:"gray",details:{note:"No criteria for "+cat}};

  const parse=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean);
  const reqC=parse(crit.requiredCenters);const prefC=parse(crit.preferredCenters);
  const gTypes=parse(crit.goodTypes);const gProf=parse(crit.goodProfiles);
  const gAuth=parse(crit.goodAuthorities);const kGates=parse(crit.keyGates).map(Number);
  const wC=Number(crit.weight_centers)||30;const wT=Number(crit.weight_type)||25;
  const wP=Number(crit.weight_profile)||15;const wG=Number(crit.weight_gates)||20;const wA=Number(crit.weight_authority)||10;
  const totalW=wC+wT+wP+wG+wA;

  const empCenters=Array.isArray(emp.centers)?emp.centers:parse(typeof emp.centers==="string"?emp.centers:"");
  const empGates=Array.isArray(emp.gates)?emp.gates.map(Number):parse(typeof emp.gates==="string"?emp.gates:"").map(Number);

  // Centers score
  let cMatch=0;const cTotal=reqC.length+prefC.length*0.5;
  const cHits=[];const cMiss=[];
  reqC.forEach(c=>{if(empCenters.includes(c)){cMatch+=1;cHits.push(c);}else cMiss.push(c);});
  prefC.forEach(c=>{if(empCenters.includes(c)){cMatch+=0.5;cHits.push(c+"*");}});
  const centerScore=cTotal>0?Math.min((cMatch/cTotal)*100,100):50;

  // Type score
  const typeMatch=gTypes.includes(emp.type);const typeScore=typeMatch?100:25;

  // Profile score
  const profMatch=gProf.includes(emp.profile);const profScore=profMatch?100:30;

  // Gates score
  let gMatch=0;const gHits=[];
  kGates.forEach(g=>{if(empGates.includes(g)){gMatch++;gHits.push(g);}});
  const gateScore=kGates.length>0?Math.min((gMatch/kGates.length)*100,100):50;

  // Authority score
  const authMatch=gAuth.includes(emp.authority);const authScore=authMatch?100:40;

  const total=Math.round((centerScore*wC+typeScore*wT+profScore*wP+gateScore*wG+authScore*wA)/totalW);
  const color=total>=75?"green":total>=45?"yellow":"red";

  return{score:total,color,details:{
    centers:{score:Math.round(centerScore),hits:cHits,miss:cMiss,weight:wC},
    type:{score:Math.round(typeScore),match:typeMatch,weight:wT},
    profile:{score:Math.round(profScore),match:profMatch,weight:wP},
    gates:{score:Math.round(gateScore),hits:gHits,total:kGates.length,weight:wG},
    authority:{score:Math.round(authScore),match:authMatch,weight:wA},
    description:crit.description||""
  }};
}

// Build tree levels from flat roles
function buildLevels(roles){
  const map={};roles.forEach(r=>{map[r.roleKey]={...r,children:[]};});
  const roots=[];
  roles.forEach(r=>{if(r.parentKey&&map[r.parentKey])map[r.parentKey].children.push(map[r.roleKey]);else roots.push(map[r.roleKey]);});
  const levels=[];
  let current=roots;
  while(current.length>0){
    levels.push(current);
    const next=[];current.forEach(n=>{next.push(...n.children);});
    current=next;
  }
  return levels;
}

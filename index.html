function jobFit(cat,e){if(!e||!cat)return"gray";const t=e.type,p=e.profile||"";if(cat==="CEO/Visionary"){if(t==="Manifestor"||t==="Projector")return"green";if(t==="Generator"||t==="Manifesting Generator")return"yellow";return"red";}if(cat==="Marketing/Sales"){if(p.includes("4")||p.includes("6")||t==="Manifesting Generator")return"green";if(t==="Projector")return"red";return"yellow";}if(cat==="Operations"||cat==="Engineering"){if(t==="Generator"||t==="Manifesting Generator")return"green";if(t==="Manifestor"||t==="Reflector")return"red";return"yellow";}if(cat==="Creative"||cat==="Product"){if(t==="Manifestor"||t==="Projector")return"green";if(t==="Generator")return"yellow";return"yellow";}return"yellow";}

// Build tree from flat roles array
function buildTree(roles,aMap){
  const map={};roles.forEach(r=>{map[r.roleKey]={...r,children:[]};});
  const roots=[];
  roles.forEach(r=>{if(r.parentKey&&map[r.parentKey])map[r.parentKey].children.push(map[r.roleKey]);else roots.push(map[r.roleKey]);});
  // Build levels for rendering
  function toLevels(nodes,level){
    if(!nodes.length)return[];
    let result=[{level,roles:nodes}];
    const nextChildren=[];nodes.forEach(n=>{if(n.children.length)nextChildren.push(...n.children);});
    if(nextChildren.length)result=result.concat(toLevels(nextChildren,level+1));
    return result;
  }
  return toLevels(roots,0);
}
